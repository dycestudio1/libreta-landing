<!--
  LIBRETA · TABLERO DEL SUPERVISOR (prototipo interactivo)
  Dearmas & Costantini · 01/10/2026

  Versión simple, con el alcance de los tableros de Rondín, Encargue y Tildalo: cinco secciones.
    #hoy   Hoy: quién está en la calle, rutas, pedidos de hoy, desvíos para responder y alertas.
    #vend  Vendedores: venta contra objetivo (con la raya de dónde deberían estar), ruta, pedidos,
           oportunidades y comisión. Tocá un vendedor para ver su ruta de hoy y sus clientes en riesgo.
    #suma  Lo que suma Libreta: oportunidades ofrecidas y vendidas, venta extra por tipo (estimada),
           clientes recuperados y lo vendido por sugerencias, mes a mes.
    #cli   Clientes: dejaron de comprar a su ritmo y deuda vencida. Tocá uno para ver su ficha.
    #ped   Pedidos: la bandeja de la app (Pendiente / En el sistema / Anulado) y la planilla para Doria.
    #ops   Oportunidades: las de cada vendedor (tipo, estado, en la ruta de hoy) y qué pasó con lo ofrecido.
    #ofe   Ofertas: se cargan, le llegan a la app de los vendedores elegidos y se sigue quién la vio,
           pedidos, unidades e importe contra una meta.
    #rut   Rutas fijas: qué clientes visita cada vendedor cada día y cada cuánto.
    #conf  Configuración: usuarios y permisos, uso de la app de cada uno, criterios, objetivos y avisos.
  La versión anterior (réplica del portal «Comercial» del Business Hub, 18 pantallas) quedó en
  dashboard/anterior/Libreta_Dashboard_Hub_Comercial.html.

  Datos de ejemplo: Distribuidora Central (mayorista de consumo masivo, Montevideo),
  supervisora Laura, vendedores María Fernández (mf), Carlos Rodríguez (cr) y Lucía Méndez (lm).
  Todo se calcula desde los datos del script, así los números cierran entre secciones.
  Cuando está incrustado en un iframe no toca el historial ni el hash.

  ===================== CONTRATO DE MENSAJES (window.postMessage) =====================
  El tablero escucha mensajes del documento que lo incrusta (por ejemplo, la demo del celular
  en la landing). Se aceptan objetos con la propiedad «tipo»:

  1) Pedido nuevo que cargó un vendedor en la app
     { tipo: 'libreta-pedido',
       pedido: { n: 'P-2417',                 // número (si falta, se numera solo)
                 cli: 'robles',               // id del cliente (robles, familia, sarandi, buenavista,
                                              //   trattoria, pepe, pasaje, estrella…) o su nombre
                 ven: 'mf',                   // mf | cr | lm (por defecto mf)
                 hora: '11:32',               // opcional (por defecto la hora del tablero)
                 tot: 12880,                  // opcional: si falta, se suma de las líneas
                 lineas: [['LI-002', 6], ['BE-003', 4, true]],  // [código, cantidad, sugerido?]
                 nota: 'Entregar antes de las 11' } }            // opcional
     → entra a Pedidos como «Pendiente», suma al contador del menú, se resalta y avisa.
       Una línea es «sugerido» si viene marcada (tercer valor true) o si es un producto que la
       app le sugería a ese cliente. Si la parada está en la ruta de hoy, queda hecha con ese
       pedido, y las oportunidades de ese cliente con esos productos pasan a vendidas
       (suman en «Lo que suma Libreta»).

  2) Solicitud o desvío que mandó un vendedor
     { tipo: 'libreta-solicitud',
       sol: { id: 17,                          // opcional
              ven: 'mf',
              tipo: 'Desvío de ruta',          // o 'Visita fuera de ruta', 'Problema en una visita'…
              txt: 'Pide cambiar el orden…',
              hora: '11:40',                   // opcional
              est: 'pend' } }                  // 'pend' (espera aprobación) o 'info' (solo revisar)
     → entra a «Para decidir» en Hoy, suma al contador y se resalta.

  3) Ir a una sección: { tipo: 'libreta-ir', vista: 'ped' }
     'ped' → Pedidos · 'desv' → Hoy · también 'hoy', 'vend', 'suma', 'cli'.

  El tablero le avisa al documento que lo incrusta (window.parent.postMessage, solo si está en un iframe):
     { tipo: 'libreta-panel-listo' }                                      al cargar
     { tipo: 'libreta-solicitud-respuesta', id, est: 'aprobada'|'rechazada'|'revisada' }
     { tipo: 'libreta-pedido-estado', n, est: 'cargado'|'anulado'|'pendiente', comprobante?, motivo? }
     { tipo: 'libreta-tarea', ven, cli, txt }                             al pedir una visita o un cobro,
                                                                          al pedir una oportunidad o al fijar un cliente hoy
     { tipo: 'libreta-oferta', oferta: {id, cod, prod, cond, hasta, ven: ['mf', …]} }   al cargar una oferta vigente
     { tipo: 'libreta-oferta-fin', id }   al terminar una oferta vigente (se saca de la app)
     { tipo: 'libreta-objetivo', ven, mes: 'AAAA-MM', obj } o { tipo: 'libreta-objetivo', ven, com }
                                          al cambiar el objetivo del mes en curso o la comisión
  Un pedido que llega con el producto de una oferta vigente (del vendedor avisado y dentro de las
  fechas) suma al seguimiento de esa oferta y su renglón queda marcado «oferta».
  ====================================================================================
-->

.t th[data-sort]:hover{color:var(--tinta)}
.t th .fl{display:inline-block;width:10px;color:var(--vereda)}
.t td{padding:9px 10px;border-bottom:1px solid var(--linea-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.t td b{font-weight:600}
.t td small{display:block;font-size:12px;color:var(--tinta-3)}
.t tr.fk{cursor:pointer}
.t tr.fk:hover td{background:#FAFBFC}
.t tr.tot td{border-top:1px solid var(--linea);font-weight:700}
.lnk{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lnk:hover b,.lnk:hover{color:var(--vereda)}
.t td.nw{white-space:nowrap}
.pag{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--tinta-3);flex-wrap:wrap}

/* listas */
.lis{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--linea-2)}
.li:first-child{border-top:0;padding-top:2px}
.li .sev{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--tinta-3)}
.li .sev.pend{background:#B8914A}
.li .sev.prob{background:var(--rojo)}
.li .sev.ok{background:var(--vereda)}
.li b{font-weight:600;font-size:13.5px}
.li p{margin:2px 0 0;font-size:13px;color:var(--tinta-2)}
.li .tm{font-family:var(--mono);font-size:11.5px;color:var(--tinta-3)}
.li .bs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.li.nueva,.ped.nuevo,.prow.nuevo{animation:resalta 3s ease}
@keyframes resalta{0%,40%{background:var(--aviso-50)}100%{background:transparent}}

/* ============ Hoy ============ */
.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.calle-card{padding-bottom:12px}
.calle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.vcalle{display:flex;flex-direction:column;gap:10px;width:100%;border:0;border-left:1px solid var(--linea-2);background:none;text-align:left;padding:2px 18px 4px;min-width:0;border-radius:0}
.vcalle:first-child{border-left:0;padding-left:2px}
.vcalle:last-child{padding-right:2px}
.vcalle:hover .quien b{color:var(--vereda)}
.vcalle .arr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}
.vcalle .prog{display:flex;flex-direction:column;gap:5px}
.vcalle .prog span{font-size:12px;color:var(--tinta-3)}
.vcalle .prog span b{color:var(--tinta);font-weight:600}
.vcalle .ahora{font-size:13px;color:var(--tinta-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcalle .ahora b{font-weight:600;color:var(--tinta)}
.vcalle .vend{text-align:right;white-space:nowrap;flex:none}
.vcalle .vend b{display:block;font:500 13px var(--mono)}
.vcalle .vend small{font-size:12px;color:var(--tinta-3)}
.ap{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--vereda);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 3px var(--vereda-50)}

.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--linea-2);background:none;text-align:left;padding:8px 2px}
.prow:first-child{border-top:0;padding-top:0}
.prow:hover b{color:var(--vereda)}
.prow .h{font:500 12px var(--mono);color:var(--tinta-3)}
.prow b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{display:block;font-size:12px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .der{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.prow .m{font:500 12.5px var(--mono);white-space:nowrap}
.prow .chip{font-size:11px;padding:2px 8px}

.alertas{display:flex;flex-direction:column;gap:8px}
.alerta{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;width:100%;border:1px solid var(--linea);border-radius:12px;background:#fff;text-align:left;padding:10px 12px}
.alerta:hover{border-color:#C6CED6}
.alerta .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.alerta .ic svg{width:16px;height:16px}
.alerta .ic.rojo{background:var(--rojo-50);color:var(--rojo)}
.alerta .ic.arena{background:var(--arena-50);color:var(--arena-tinta)}
.alerta .ic.nar{background:var(--aviso-50);color:var(--aviso-tinta)}
.alerta .ic.ver{background:var(--vereda-50);color:var(--vereda)}
.alerta b{display:block;font-size:13.5px;font-weight:600}
.alerta small{display:block;font-size:12.5px;color:var(--tinta-3);line-height:1.4}

/* ============ Vendedores ============ */
.vlista{display:flex;flex-direction:column;gap:10px}
.vcols,.vrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.9fr) minmax(0,.85fr) minmax(0,.85fr) minmax(0,.95fr) minmax(0,.9fr) 18px;gap:18px;align-items:center}
.vcols{padding:0 18px;font:500 10.5px var(--mono);color:var(--tinta-3);text-transform:uppercase;letter-spacing:.05em}
.vrow{width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-2);padding:16px 18px}
.vrow:hover{border-color:#C6CED6}
.vrow:hover .quien b{color:var(--vereda)}
.vrow .avt{width:36px;height:36px;font-size:12.5px}
.vrow .c b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.vrow .c small{display:block;font-size:12px;color:var(--tinta-3);white-space:nowrap}
.vrow .obj{display:flex;flex-direction:column;gap:7px}
.vrow .obj .oh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vrow .obj .oh b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.vrow .obj .oh span{font-size:12.5px;color:var(--tinta-3)}
.vrow .obj .oh em{margin-left:auto;font-style:normal;font:500 12.5px var(--mono)}
.vrow .chev{color:var(--tinta-3)}
.vrow .chev svg{width:16px;height:16px}
.vrow .lbl-m{display:none}

/* ============ Lo que suma ============ */
.mam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;height:230px;padding:22px 4px 0;border-bottom:1px solid var(--linea)}
.mam-c{display:flex;flex-direction:column;min-width:0}
.mam-b{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:12px;background:linear-gradient(var(--linea-2),var(--linea-2)) 0 33%/100% 1px no-repeat,linear-gradient(var(--linea-2),var(--linea-2)) 0 66%/100% 1px no-repeat}
.mam-b span{position:relative;width:min(30px,36%);border-radius:5px 5px 0 0;min-height:2px}
.mam-b .b1{background:#5E9AA3}
.mam-b .b2{background:var(--vereda-clara)}
.mam-c.hl .b1{background:var(--vereda)}
.mam-b em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;font:500 10px var(--mono);font-style:normal;color:var(--tinta-2);white-space:nowrap}
.mam-c.hl em{color:var(--tinta)}
.mam-c small{text-align:center;font:400 11px var(--mono);color:var(--tinta-3);padding:6px 0 0;margin-bottom:-24px}
.mam-c.hl small{color:var(--tinta);font-weight:500}
.mam + .ley{margin-top:30px}
.mini-m{display:flex;align-items:center;gap:8px;min-width:120px}
.mini-m .meter{flex:1;min-width:50px}
.mini-m span{font:500 12px var(--mono);width:36px;text-align:right}
.como{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.como li{font-size:13px;color:var(--tinta-2);padding-left:14px;position:relative}
.como li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--vereda-clara)}
.como li b{color:var(--tinta)}
.est{font:500 10.5px var(--mono);color:var(--tinta-3);border:1px solid var(--linea);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px;letter-spacing:.02em}
.kpi.dest .est{color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.35)}

/* pedidos (bandeja como en la app) */
.peds{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.ped{background:#fff;border:1px solid var(--linea);border-radius:13px;box-shadow:var(--sombra-1)}
.ped-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:12px 16px;text-align:left;flex-wrap:wrap}
.ped-h .l{min-width:0;display:flex;flex-direction:column;gap:2px}
.ped-h .l span{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.ped-h .l .n{font:500 12.5px var(--mono);color:var(--tinta-3)}
.ped-h .l small{font-size:12px;color:var(--tinta-3)}
.ped-h .tot{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ped-b{border-top:1px solid var(--linea-2);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.ped-nota{background:var(--papel);border-radius:9px;padding:8px 11px;font-size:12.5px}
.ped-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ped-in{display:flex;gap:8px;flex-wrap:wrap}
.ped-in .campo{flex:1;min-width:200px;height:36px}

/* ruta (timeline) */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:46px 22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--linea-2)}
.tl-i:first-child{border-top:0}
.tl-i .h{font:500 12px var(--mono);color:var(--tinta-3);padding-top:2px}
.tl-i .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);background:var(--papel);color:var(--tinta-2);border:1px solid var(--linea);position:relative}
.tl-i .d.hecha{background:var(--vereda);color:#fff;border-color:var(--vereda)}
.tl-i .d.visita{background:#fff;color:var(--vereda);border:2px solid var(--vereda)}
.tl-i .d.prob{background:var(--rojo-50);color:var(--rojo);border-color:var(--rojo-50)}
.tl-i .d .op{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--aviso);border:1.5px solid #fff}
.tl-i b{font-weight:600;font-size:13.5px}
.tl-i small{display:block;font-size:12px;color:var(--tinta-3)}

/* ficha (panel lateral) */
.velo-f{position:fixed;inset:0;background:rgba(16,34,42,.32);z-index:60}
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--papel);z-index:61;display:flex;flex-direction:column;box-shadow:var(--sombra-3);animation:entra .2s ease}
@keyframes entra{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.fi-h{background:#fff;border-bottom:1px solid var(--linea);padding:16px 18px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
.fi-h .av,.fi-h .avt{width:40px;height:40px;font-size:13px}
.fi-h .av svg{width:20px;height:20px;color:#fff}
.t tr.nuevo td{animation:resalta 3s ease}
.sug.of{background:var(--aviso-50);color:var(--aviso-tinta)}
.fi-h small{display:block;font-size:12px;color:var(--tinta-3)}
.fi-h h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.fi-b{flex:1;overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px}
.fi-b .kpi b{font-size:19px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--linea);background:#fff;display:grid;place-items:center;color:var(--tinta-2)}
.x svg{width:16px;height:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.facs{display:flex;flex-direction:column}
.facs div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--linea-2);font-size:13px}
.facs div:first-child{border-top:0;padding-top:0}
.facs .mono{font-size:12px;color:var(--tinta-2)}
.facs b{font:500 12.5px var(--mono);text-align:right}

/* toast */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--tinta);color:#fff;border-radius:12px;padding:10px 12px 10px 14px;font-size:13.5px;display:flex;align-items:center;gap:12px;box-shadow:var(--sombra-3);animation:sube .2s ease}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;height:28px;padding:0 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ responsive ============ */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis.k-hoy{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis.k-hoy .grande{grid-column:span 3}
  .kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-hoy,.f21{grid-template-columns:minmax(0,1fr)}
  .f3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .f3 > :last-child{grid-column:1/-1}
  .vcols{display:none}
  .vrow{grid-template-columns:repeat(4,minmax(0,1fr)) 18px;gap:12px 18px}
  .vrow .quien{grid-column:1/3}
  .vrow .obj{grid-column:3/5}
  .vrow .chev{grid-column:5;grid-row:1}
  .vrow .lbl-m{display:block;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-3);margin-bottom:2px}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lat{position:fixed;left:0;top:0;bottom:0;width:272px;height:100%;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--sombra-3)}
  body.menu-abierto .lat{transform:none}
  body.menu-abierto .velo{display:block;position:fixed;inset:0;background:rgba(16,34,42,.32);z-index:25}
  .cerrar-lat{display:grid;width:34px;height:34px;border-radius:9px;border:1px solid var(--linea);background:#fff;place-items:center;color:var(--tinta-2)}
  .cerrar-lat svg{width:15px;height:15px}
  .hamb{display:grid}
  .f2,.f3{grid-template-columns:minmax(0,1fr)}
  .calle{grid-template-columns:minmax(0,1fr)}
  .vcalle{border-left:0;border-top:1px solid var(--linea-2);padding:12px 2px}
  .vcalle:first-child{border-top:0;padding-top:2px}
}
@media (max-width:760px){
  .pri{padding:14px 16px 90px;gap:14px}
  .cab{flex-direction:column;align-items:stretch;gap:10px;min-height:0}
  .cab h1{font-size:21px}
  .cab p{font-size:13px}
  .cab-der:empty{display:none}
  .kpis,.kpis.k3,.kpis.k4,.kpis.k-hoy{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpis.k-hoy .grande{grid-column:1/-1}
  .kpis:not(.k3):not(.k4):not(.k-hoy) > .dest:first-child{grid-column:1/-1}
  .kpi{padding:12px}
  .kpi b{font-size:19px}
  .kpi.grande b{font-size:26px}
  .card{padding:14px}
  .vcalle .ahora{white-space:normal}
  .mam{gap:8px}
  .vrow{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}
  .vrow .quien,.vrow .obj{grid-column:1/-1}
  .vrow .chev{display:none}
  .vrow .c b{font-size:15px}
  .hb{grid-template-columns:84px minmax(0,1fr) auto;gap:8px}
  .tl-i{grid-template-columns:42px 22px minmax(0,1fr)}
  .tl-i > :last-child{grid-column:3}
  .ped-b .t th:nth-child(4),.ped-b .t td:nth-child(4){display:none}
  .ped-h{padding:12px 14px}
  .ped-b{padding:10px 12px 12px}
  .ped-in .campo{min-width:0;flex-basis:100%}
}

/* ============ menú agrupado ============ */
.menu-g{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-3);padding:12px 10px 4px}
.menu-g:first-child{padding-top:2px}
.menu .it.conf{margin-top:6px}

/* ============ formularios, pestañas y llaves ============ */
.fm{display:flex;flex-direction:column;gap:12px}
.fm label,.fm fieldset{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--tinta-2);margin:0;border:0;padding:0;min-width:0}
.fm legend{padding:0;margin-bottom:5px}
.fm .campo{height:38px;width:100%;font-size:13.5px}
.fm .dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fm .ayuda{font-weight:500;color:var(--tinta-3);font-size:12px}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:7px!important;height:32px;padding:0 11px;border:1px solid var(--linea);border-radius:999px;background:#fff;font-weight:600;font-size:13px;color:var(--tinta-2);cursor:pointer}
.ck input{margin:0;accent-color:var(--vereda)}
.ck:has(input:checked){background:var(--vereda-50);border-color:var(--vereda-100);color:var(--vereda)}
.prev{background:var(--papel);border-radius:12px;padding:10px 12px}
.prev .lbl{display:block;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-3);margin-bottom:6px}
.noti-p{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:9px 10px;box-shadow:var(--sombra-1)}
.noti-p .ic{width:30px;height:30px;border-radius:8px;background:var(--vereda);display:grid;place-items:center}
.noti-p .ic svg{width:22px;height:22px}
.noti-p b{display:block;font-size:13px}
.noti-p small{display:block;font-size:12px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs-c{display:flex;gap:2px;border-bottom:1px solid var(--linea);overflow-x:auto;scrollbar-width:none}
.tabs-c::-webkit-scrollbar{display:none}
.tabs-c button{flex:none;border:0;background:none;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--tinta-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-c button:hover{color:var(--tinta)}
.tabs-c button[aria-selected="true"]{color:var(--vereda);border-bottom-color:var(--vereda)}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-weight:600;font-size:12.5px;color:var(--tinta-2);white-space:nowrap}
.sw i{width:34px;height:20px;border-radius:999px;background:#C9D1D6;position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw[aria-pressed="true"] i{background:var(--vereda)}
.sw[aria-pressed="true"] i::after{transform:translateX(14px)}
.num-in{width:84px!important;text-align:right;font-family:var(--mono)}
.mes-sel{display:flex;align-items:center;gap:6px}
.mes-sel .btn{width:38px;height:38px;padding:0;justify-content:center}
.mes-sel .btn svg{width:16px;height:16px}
.cab-acc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lnk-v{color:var(--vereda);font-weight:700;white-space:nowrap}
.lnk-v:hover{text-decoration:underline}
.obj-acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.obj-acc label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tinta-2);margin-left:auto}
.lnk-clave{display:block;margin-top:7px;font-size:12px;font-weight:600;color:var(--vereda);white-space:nowrap}
.lnk-clave:disabled{color:var(--tinta-3);cursor:default}
.clave{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--aviso-50);border:1px solid #FFD5C4;border-radius:12px;padding:10px 12px;font-size:13px}

.op-por{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.op-v{display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-1);padding:14px 16px}

.op-que b{display:block;font-weight:600;font-size:13.5px}
.op-que small{display:block;font-size:12px;color:var(--tinta-3);line-height:1.4;margin-top:2px;white-space:normal}

/* ============ ofertas ============ */
.of-p b{display:block;font-weight:600}
.of-p small{display:block;font-size:12px;color:var(--tinta-3)}
.of-meta{display:flex;align-items:center;gap:8px;min-width:130px}
.of-meta .meter{flex:1}
.of-meta span{font:500 12px var(--mono);white-space:nowrap}
.avs{display:flex;gap:3px}
.avs+small{white-space:nowrap}
.avs .avt{width:24px;height:24px;font-size:10px}
.avs .avt.no{opacity:.35}

/* ============ rutas fijas ============ */
.dias{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.dia{background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-1);padding:12px 12px 10px;min-width:0}

.dia-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.dia-h b{font-size:14.5px}
.dia-h small{font-size:12px;color:var(--tinta-3)}
.rf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rf li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--linea-2)}
.rf li:first-child{border-top:0}
.rf .n{width:22px;height:22px;border-radius:50%;background:var(--papel);display:grid;place-items:center;font:600 11px var(--mono);color:var(--tinta-2)}
.rf b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf small{display:block;font-size:11.5px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf .fr{color:var(--aviso-tinta)}
.rf .bt{display:flex;gap:2px;opacity:.35;transition:opacity .15s}
.rf li:hover .bt,.rf li:focus-within .bt{opacity:1}
.rf .bt button{width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--tinta-2);display:grid;place-items:center;padding:0}
.rf .bt button:hover{background:var(--papel);color:var(--tinta)}
.rf .bt svg{width:13px;height:13px}
.dia .vacio-d{font-size:12.5px;color:var(--tinta-3);padding:6px 0 4px}
.dia .agregar{width:100%;margin-top:8px;height:32px;border:1px dashed #C6CED6;border-radius:9px;background:none;color:var(--vereda);font-weight:700;font-size:12.5px}
.dia .agregar:hover{border-color:var(--vereda);background:var(--vereda-50)}
.rf-lista{display:flex;flex-direction:column;max-height:44vh;overflow-y:auto;border:1px solid var(--linea);border-radius:12px;background:#fff}
.rf-lista label{display:grid!important;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--linea-2);font-weight:500!important;color:var(--tinta)!important;cursor:pointer}
.rf-lista label:first-child{border-top:0}
.rf-lista input{accent-color:var(--vereda);margin:0}
.rf-lista small{font-size:12px;color:var(--tinta-3);font-family:var(--mono)}

.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ucard{display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-1);padding:14px 16px}
.ucard:hover{border-color:#C6CED6}
.ucard.apagada{opacity:.55;box-shadow:none}
.ucard .ent{display:flex;align-items:baseline;gap:8px}
.ucard .ent b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ucard .ent span{font-size:12.5px;color:var(--tinta-3)}
.ucard p{margin:0;font-size:12.5px;color:var(--tinta-2)}
.ucard .secs{display:flex;flex-wrap:wrap;gap:5px}
.ucard .secs span{font-size:11.5px;background:var(--papel);border-radius:999px;padding:2px 8px;color:var(--tinta-2)}
.ucard .secs span b{font:500 11px var(--mono);margin-left:3px}
.acc-l{display:flex;flex-direction:column}
.acc-l div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--linea-2);font-size:13px}
.acc-l div:first-child{border-top:0;padding-top:0}
.acc-l small{display:block;font-size:11.5px;color:var(--tinta-3)}
.acc-l b{font:500 13px var(--mono)}

    nc: NOTAS_CREDITO[per], riesgo: riesgo(v), cobrar: suma(CLIENTES.filter(function(c){ return !v || c.v === v; }), function(c){ return c.sal; }), vencido: suma(vencidos(v), function(c){ return c.ven; })};
}
function catVenta(total){ var r = {}; CATS.forEach(function(c){ r[c] = Math.round(total * CAT_PESO[c]); }); return r; }

    var enCat = CATALOGO.filter(function(x){ return x.cat === p.cat; }), w = suma(enCat, function(x){ return (POP[x.c] || 1) * x.p; });

/* ================================ piezas de interfaz ================================ */
function tabla(id, cols, filas, opt){

  var total = filas.length, lim = opt.pag ? (S.pag[id] || opt.pag) : total, vis = filas.slice(0, lim);
  var h = '<div class="tw"><table class="t"><thead><tr>' + cols.map(function(c, i){
    var ord = c.s !== false && c.l ? ' data-sort="' + id + ':' + i + '"' : '', fl = st && st[0] === i ? (st[1] > 0 ? '↑' : '↓') : '';
    return '<th class="' + (c.r ? 'r' : '') + '"' + (c.w ? ' style="min-width:' + c.w + 'px"' : '') + ord + (ord ? ' aria-sort="' + (fl ? (st[1] > 0 ? 'ascending' : 'descending') : 'none') + '"' : '') + '>' + (c.l || '') + (ord ? ' <span class="fl">' + fl + '</span>' : '') + '</th>';
  }).join('') + '</tr></thead><tbody>';
  h += vis.map(function(f){ return '<tr' + (f.a ? ' ' + f.a : '') + '>' + f.c.map(function(x, i){ return '<td class="' + (cols[i].r ? 'r' : '') + (cols[i].nw ? ' nw' : '') + '">' + x + '</td>'; }).join('') + '</tr>'; }).join('');
  if (!vis.length) h += '<tr><td colspan="' + cols.length + '" class="muted" style="text-align:center;padding:22px">' + (opt.vacio || 'Nothing to show with these filters.') + '</td></tr>';
  h += '</tbody></table></div>';
  if (opt.pag && total > opt.pag) h += '<div class="pag"><span>Showing ' + vis.length + ' of ' + total + '</span>' + (lim < total ? '<button type="button" class="btn btn-s btn-sm" data-a="mas" data-id="' + id + '" data-n="' + opt.pag + '">Show ' + Math.min(opt.pag, total - lim) + ' more</button>' : '<button type="button" class="btn btn-g btn-sm" data-a="menos" data-id="' + id + '">Show less</button>') + '</div>';
  return h;
}

function filtroChips(clave, ops, actual){ return '<div class="filtros" role="group">' + ops.map(function(o){ return o === '|' ? '<span class="fsep"></span>' : '<button type="button" class="fc" data-a="filtro" data-k="' + clave + '" data-val="' + o[0] + '" aria-pressed="' + (actual === o[0]) + '">' + o[1] + (o[2] != null ? ' <i>' + o[2] + '</i>' : '') + '</button>'; }).join('') + '</div>'; }
function chipsVend(clave, actual, conteo){ return filtroChips(clave, [['todos', 'All', conteo ? conteo('todos') : null]].concat(VEND.map(function(v){ return [v.id, v.corto, conteo ? conteo(v.id) : null]; })), actual); }
function segm(clave, ops, actual){ return '<div class="seg" role="group">' + ops.map(function(o){ return '<button type="button" data-a="filtro" data-k="' + clave + '" data-val="' + o[0] + '" aria-pressed="' + (actual === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div>'; }
function medidor(p, tono, marca){ return '<div class="meter ' + (tono || '') + '"><i style="width:' + Math.max(0, Math.min(100, p)) + '%"></i>' + (marca != null ? '<u style="left:' + Math.min(100, marca) + '%"></u>' : '') + '</div>'; }
function hbar(lbl, v, max, txt, cls, marca){ return '<div class="hb"><span>' + lbl + '</span><div class="p"><i class="' + (cls || '') + '" style="width:' + (max ? Math.max(1, v / max * 100) : 0).toFixed(1) + '%"></i>' + (marca != null ? '<u style="left:' + (marca / max * 100).toFixed(1) + '%"></u>' : '') + '</div><b>' + txt + '</b></div>'; }
function spark(vals, tono){
  var max = Math.max.apply(null, vals) || 1, w = 96, h = 26, n = vals.length;
  var pts = vals.map(function(v, i){ return (i * (w - 4) / (n - 1) + 2).toFixed(1) + ',' + (h - 3 - v / max * (h - 6)).toFixed(1); }).join(' ');
  var col = tono === 'mal' ? '#C63A22' : tono === 'bien' ? '#0B6E7C' : '#74848A';
  return '<svg class="spark" viewBox="0 0 96 26" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function barras(series, etiquetas, opt){
  opt = opt || {};
  var W = 640, H = opt.h || 210, pl = 8, pb = 22, pt = 18, n = etiquetas.length, g = (W - pl * 2) / n, bw = Math.min(22, (g - 10) / series.length);
  var max = Math.max.apply(null, series.map(function(s){ return Math.max.apply(null, s.v); })) || 1;
  var h = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.aria || 'Bar chart') + '">';
  for (var k = 1; k <= 3; k++){ var y = pt + (H - pt - pb) * (1 - k / 3); h += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#EDF0F3"/>'; }
  etiquetas.forEach(function(e, i){
    var x0 = pl + g * i + (g - bw * series.length - 3 * (series.length - 1)) / 2;
    series.forEach(function(s, j){
      var v = s.v[i], bh = Math.max(v ? 2 : 0, (H - pt - pb) * v / max), x = x0 + j * (bw + 3), y = H - pb - bh;
      var col = typeof s.c === 'function' ? s.c(i) : s.c;
      h += '<rect class="bar" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + col + '"><title>' + esc(s.n + ' · ' + e + ': ' + (opt.fmt ? opt.fmt(v) : v)) + '</title></rect>';
      if (opt.hl === i && j === series.length - 1) h += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle">' + esc(opt.fmt ? opt.fmt(v) : v) + '</text>';
    });
    h += '<text class="eje" x="' + (pl + g * i + g / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle"' + (opt.hl === i ? ' style="fill:#10222A;font-weight:500"' : '') + '>' + esc(e) + '</text>';

function estadoRuta(ven){ var r = RUTAS[ven], hechas = r.filter(function(x){ return x.est === 'hecha' || x.est === 'prob'; }).length; return {hechas: hechas, plan: r.filter(function(x){ return !x.fuera; }).length, total: r.length}; }

/* ---------- Hoy ---------- */

  var ph = pedidosHoy().slice().sort(function(a, b){ return aMin(b.hora) - aMin(a.hora); }), tot = suma(ph, function(p){ return p.tot; });
  var hechas = suma(VEND, function(v){ return estadoRuta(v.id).hechas; }), plan = suma(VEND, function(v){ return estadoRuta(v.id).total; });
  var pend = pendientes(), M = metricas('set'), p = pc(M.venta, M.obj), sp = solPend(), oh = opsRuta(), vendHoy = OPS.filter(function(o){ return o.est === 'vendida' && o.ped && o.ped !== 'cobrado'; }).length;
  var h = '<section class="kpis k-hoy">' +
    '<div class="kpi dest grande"><div class="fd"><small>Sold today</small><small>' + ph.length + ' orders · avg. ' + $u(ph.length ? tot / ph.length : 0) + '</small></div><b>' + $u(tot) + '</b><div class="bb" aria-hidden="true"><i style="width:' + pc(hechas, plan) + '%"></i></div><em>' + hechas + ' of ' + plan + ' visits done as of ' + S.hora + '</em></div>' +
    kpi('Today’s visits', hechas + ' of ' + plan, pc(hechas, plan) + '% of today’s route') +
    kpi('To offer on the route', String(oh.length), oh.length ? '≈ ' + $m(suma(oh, function(o){ return o.v; })) + ' a month · ' + vendHoy + ' sold today' : vendHoy + ' sold today', '', '', 'ops') +
    kpi('To enter in Doria', String(pend.length), pend.length ? $u(suma(pend, function(x){ return x.tot; })) + ' in orders' : 'All caught up', '', '', 'ped') +
    kpi('September target', p + '%', 'should be at ' + ritmo('set') + '%', p >= ritmo('set') - 5 ? 'bien' : 'mal', '', 'vend') + '</section>';

  var calle = VEND.map(function(v){
    var e = rutaInfo(v.id), ps = pedidosHoy(v.id), pv = pc(e.hechas, e.total);
    var ahora = e.act ? 'Visiting <b>' + esc(nombreCli(e.act.c)) + '</b> since ' + esc(e.act.lle)

      '<span class="prog">' + medidor(pv) + '<span><b>' + e.hechas + ' of ' + e.total + '</b> visits' + (e.prob ? ' · <span class="baja">' + e.prob + ' with issues</span>' : '') + '</span></span>' +
      '<span class="ahora">' + ahora + '</span></button>';
  }).join('');

  var decidir = sp.length ? listaDesvios(sp) : '<p class="nota" style="padding:6px 0">Nothing needs your answer. Detours and issues reported by reps show up here.</p>';

    var c = CX[x.cli], e = PED_EST[x.est];

function opsRuta(){

function recibirPedido(d){
  if (!d || typeof d !== 'object') return;
  var cliId = CX[d.cli] ? d.cli : (CLIENTES.find(function(c){ return sinT(c.n) === sinT(d.cli || ''); }) || {}).id;
  var ven = VX[d.ven] ? d.ven : (cliId ? CX[cliId].v : 'mf');
  var num = typeof d.n === 'string' && /^[\w-]{1,20}$/.test(d.n) ? d.n : 'P-' + N_PED;
  if (PEDIDOS.some(function(p){ return p.n === num; })) return;
  var m = /^P-(\d+)$/.exec(num); if (m && +m[1] >= N_PED) N_PED = +m[1] + 1;
  var sugCli = cliId ? CX[cliId].sug : [], ops = OPS.filter(function(o){ return o.c === cliId; });
  var lin = (Array.isArray(d.lineas) ? d.lineas : []).filter(function(l){ return Array.isArray(l) && l.length >= 2 && +l[1] > 0; }).slice(0, 80).map(function(l){
    var p = PROD[l[0]] || {c: String(l[0]).slice(0, 20), d: String(l[0]).slice(0, 60), p: 0}, q = Math.round(+l[1]);
    var sug = l[2] === true || sugCli.indexOf(p.c) >= 0 || ops.some(function(o){ return (o.cods || []).indexOf(p.c) >= 0; });
    return {c: p.c, d: p.d, q: q, p: p.p, imp: p.p * q, sug: sug};
  });
  var tot = typeof d.tot === 'number' && d.tot > 0 ? Math.round(d.tot) : suma(lin, function(l){ return l.imp; });
  var hora = typeof d.hora === 'string' && /^\d{1,2}:\d{2}$/.test(d.hora) ? d.hora : S.hora;
  var ped = {n: num, cli: cliId || String(d.cli || 'Customer').slice(0, 60), ven: ven, f: '9/29', hora: hora, est: 'pend', lin: lin, tot: tot, nota: typeof d.nota === 'string' ? d.nota.slice(0, 200) : '', demo: true};
  PEDIDOS.unshift(ped);
  // seguimiento de ofertas: el pedido suma a la oferta vigente de ese producto
  var ofHits = marcarOfertas(ped);
  ofHits.forEach(function(x){ var o = x[0], l = x[1], t = o.ven[ven] || (o.ven[ven] = [0, 0, 0]); t[0]++; t[1] += l.q; t[2] += l.imp; if (!o.vio[ven]) o.vio[ven] = '9/29 ' + hora; });
  if (cliId){
    var c = CX[cliId]; c.u = 0;
    RUTAS[ven].forEach(function(s){ if (s.c === cliId && s.est !== 'hecha'){ s.est = 'hecha'; s.lle = s.lle || hora; s.ped = num; } });
    OPS.forEach(function(o){ if (o.c === cliId && !o.est && !o.off && (o.cods || []).some(function(cd){ return lin.some(function(l){ return l.c === cd; }); })){
      o.est = 'vendida'; o.ped = num; S.extraConc++;
      S.vendHoy.push({t: o.t, ven: o.w, ped: num, imp: suma(lin.filter(function(l){ return (o.cods || []).indexOf(l.c) >= 0; }), function(l){ return l.imp; })});
    } });
  }
  S.pedOpen[num] = true; marcarNuevo(num);
  toast('New order from ' + corV(ven) + ': ' + num + ' · ' + (cliId ? CX[cliId].n : ped.cli) + ' · ' + $u(tot) + (ofHits.length ? ' · includes the promotion on ' + PROD[ofHits[0][0].p].d : ''), S.v === 'ped' ? null : 'View', function(){ S.pedV = 'pend'; S.pedVen = 'todos'; ir('ped'); });
  if (S.v === 'ped'){ S.pedV = S.pedV === 'todos' ? 'todos' : 'pend'; }
  render(true);
}
function recibirSolicitud(d){
  if (!d || typeof d !== 'object' || !d.txt) return;
  var id = typeof d.id === 'number' && !SOL.some(function(s){ return s.id === d.id; }) ? d.id : Date.now();
  var s = {id: id, ven: VX[d.ven] ? d.ven : 'mf', tipo: String(d.tipo || 'Request').slice(0, 60), txt: String(d.txt).slice(0, 300), hora: typeof d.hora === 'string' && /^\d{1,2}:\d{2}$/.test(d.hora) ? d.hora : S.hora, f: 'hoy', est: d.est === 'info' ? 'info' : 'pend', cli: CX[d.cli] ? d.cli : null};
  SOL.unshift(s); marcarNuevo('sol' + s.id);
  toast(s.tipo + ' from ' + corV(s.ven) + (s.est === 'pend' ? ': waiting for your answer.' : ': to review.'), S.v === 'hoy' ? null : 'View', function(){ ir('hoy'); });
  render(true);
}
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.tipo === 'libreta-pedido') recibirPedido(d.pedido);
  else if (d.tipo === 'libreta-solicitud') recibirSolicitud(d.sol);
  else if (d.tipo === 'libreta-ir' && typeof d.vista === 'string' && (R[d.vista] || ALIAS[d.vista])){ cerrarCapa(); ir(d.vista); }

/* reloj del tablero: avanza de a un minuto */
setInterval(function(){
  var m = aMin(S.hora) + 1; S.hora = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  $('sync').textContent = 'Connected to Doria · ' + S.hora;
  var r = $('reloj-h'); if (r) r.textContent = S.hora;
}, 60000);

/* arranque */
(function(){
  var h = (location.hash || '').slice(1);
  h = ALIAS[h] || h;
  if (R[h]) S.v = h;
  $('sync').textContent = 'Connected to Doria · ' + S.hora;
  render();
  avisarPadre({tipo: 'libreta-panel-listo'});
})();
})();
</script>
